# Releases what is on main and newer than the last release, when that includes code: scripts/change-scope.sh says
# `release` for the change from the last release's tag to main. Every push to main tries, so a release that failed or
# was cancelled goes out with the next push, or at once when this workflow is run on main by hand (Actions › Release ›
# Run workflow). It publishes the app, the command and SHA256SUMS as an immutable GitHub release, each file with a
# build-provenance attestation. Its jobs each hold only what they need (docs/releasing.md): Release protections reads
# that the repository guards what a release depends on; CI compiles and builds the release with no secret; Sign and
# notarize holds the signing key, waits for a maintainer's approval and compiles nothing; Publish holds the token that
# writes the release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # releases go out one after another, never half-way

env:
  # One toolchain for every macOS job, named by path on the runner image (docs/releasing.md › Tools and runners).
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  last-release:
    name: Last release
    # Only main is released, also when the workflow is run by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: The last release's tag
        id: tag
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Last release: ${tag:-none}" >> "$GITHUB_STEP_SUMMARY"

  protections:
    name: Release protections
    # Nothing is signed or published while the repository does not guard it (docs/repository-settings.md): a
    # maintainer approves each signing, and no release's tag can be moved or deleted. Immutable releases, which a
    # workflow cannot read, are checked by Publish on the release it makes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: The release environment asks a maintainer, and tags are protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=""
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[].type] | join(" ")') ||
            { echo "::error::Could not read the release environment"; exit 1; }
          case " $rules " in
            *" required_reviewers "*) ;;
            *) failed="$failed release-reviewers"; echo "::error::The release environment requires no reviewer (docs/repository-settings.md › The release environment)." ;;
          esac
          tags=$(gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true" --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id') ||
            { echo "::error::Could not read the repository's rulesets"; exit 1; }
          guarded=""
          for id in $tags; do
            # It covers v* (or every tag), excludes nothing, and lets no one bypass it, as far as this token is shown:
            # the bypass list is shown to admins alone, so docs/repository-settings.md has an admin check it too.
            if gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" --jq '
                (.conditions.ref_name.include | any(. == "refs/tags/v*" or . == "refs/tags/*" or . == "refs/tags/**" or . == "~ALL")) and
                ((.conditions.ref_name.exclude // []) == []) and ((.bypass_actors // []) == []) and
                ([.rules[].type] | (index("deletion") != null and index("update") != null and index("non_fast_forward") != null))' |
              grep -qx true; then
              guarded=yes
            fi
          done
          if [ -z "$guarded" ]; then
            failed="$failed tag-ruleset"
            echo "::error::No active tag ruleset, excluding nothing and with no bypass, keeps refs/tags/v* from being updated or deleted (docs/repository-settings.md › Releases)."
          fi
          [ -z "$failed" ] || exit 1
          # Immutable releases are an admin's to read; the latest release says whether they were on when it went out.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .immutable 2>/dev/null)" != true ]; then
            echo "::warning::The latest release is not immutable: unless immutable releases are on now, the release this run publishes fails its last step (docs/repository-settings.md › Releases)."
          fi
          echo "Release protections: a reviewer approves signing; v* tags cannot be moved or deleted" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: [last-release, protections]
    uses: ./.github/workflows/ci.yml
    with:
      base: ${{ needs.last-release.outputs.tag }}
      keep-release-build: true
    permissions:
      contents: read

  sign:
    name: Sign and notarize
    needs: ci
    if: needs.ci.outputs.scope == 'release'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions: {}
    outputs:
      version: ${{ steps.package.outputs.version }}
      signing: ${{ steps.signing.outputs.signing }}
      signer: ${{ steps.signer.outputs.signer }}
    env:
      # How the release is signed is said, never inferred from which secrets are there (docs/releasing.md › Signing).
      RELEASE_SIGNING: ${{ vars.RELEASE_SIGNING }}
    steps:
      - name: The pinned Xcode is on the runner
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image; choose an Xcode it has (docs/releasing.md › Tools and runners)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: How the release is signed
        id: signing
        run: |
          case $RELEASE_SIGNING in
            developer-id | ad-hoc)
              echo "signing=$RELEASE_SIGNING" >> "$GITHUB_OUTPUT"
              echo "Signing: $RELEASE_SIGNING" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Set the release environment's variable RELEASE_SIGNING to developer-id or ad-hoc (docs/releasing.md › Signing)."
              exit 1
              ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}
      - name: Unpack the release build
        run: ditto -x -k "$RUNNER_TEMP/release-build.zip" "$RUNNER_TEMP/stage"
      - name: Import the Developer ID certificate and the notarization key
        if: env.RELEASE_SIGNING == 'developer-id'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.DEVELOPER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          missing=""
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD IDENTITY NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::RELEASE_SIGNING is developer-id, but the release environment lacks the secrets for:$missing (docs/releasing.md › Signing)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The key is for the tools that sign with it alone, never any process of the job (`-A`).
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "DEVELOPER_ID=$IDENTITY"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Sign, notarize and package
        id: package
        run: scripts/release.sh "$RUNNER_TEMP/stage"
      - name: Who signed it
        id: signer
        run: |
          app=$(find "$RUNNER_TEMP/stage" -maxdepth 3 -name Arrumator.app -type d | head -n 1)
          signer=$(codesign -dv --verbose=2 "$app" 2>&1 | sed -n 's/^Authority=//p' | head -n 1)
          echo "signer=${signer:-ad hoc}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Remove the signing keychain
        if: always() && env.RELEASE_SIGNING == 'developer-id'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

  publish:
    name: Publish
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the release and its tag
      id-token: write # signs the provenance attestations
      attestations: write
    env:
      RELEASE_SIGNING: ${{ needs.sign.outputs.signing }}
      SIGNER: ${{ needs.sign.outputs.signer }}
      VERSION: ${{ needs.sign.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # Every file, SHA256SUMS among them, so the checksums users compare with are the workflow's too.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Each attestation verifies as users verify it
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
          done
      - name: Publish
        run: |
          verify="Check a download with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`; \`shasum -a 256 -c SHA256SUMS\` only shows it was not damaged on the way."
          if [ "$RELEASE_SIGNING" = developer-id ]; then
            install="Signed by $SIGNER and notarized by Apple: unzip and move Arrumator to Applications."
            kind=--latest
          else
            # Never the latest release: users are not taught to let an app macOS blocks open.
            install="A prerelease, signed ad hoc and not notarized: macOS blocks it. Prefer the latest release."
            kind=--prerelease
          fi
          # A draft first, its files uploaded, then published at once: with immutable releases on, the files and the tag
          # of a published release can no longer change.
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft "$kind" \
            --title "Arrumator $VERSION" --generate-notes --notes "$install $verify"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: The release is immutable
        run: |
          immutable=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)
          if [ "$immutable" != true ]; then
            echo "::error::v$VERSION is published but its files and tag can still change: turn on immutable releases (docs/repository-settings.md › Releases)."
            exit 1
          fi
